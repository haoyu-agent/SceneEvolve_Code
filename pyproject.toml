[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneevolve"
version = "0.1.0"
description = "SceneAct reconstruction and MetaHarness evolution"
requires-python = ">=3.11"
dependencies = ["openai>=1.66", "numpy", "Pillow", "PyYAML", "torch", "torchvision", "transformers>=4.40,<5", "lpips>=0.1.4", "scikit-image"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["sceneact"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
